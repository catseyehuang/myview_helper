<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌿 MyView Helper 🌿</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Sage Style Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        body {
            /* Sage Style: 柔和的鼠尾草綠與大地色系 */
            font-family: 'Quicksand', 'Noto Sans TC', sans-serif;
            background-color: #f4f7f6; /* 極淺的灰綠色 */
            -webkit-tap-highlight-color: transparent;
            color: #3e504c; /* 深鼠尾草綠 */
        }

        .card-shadow {
            box-shadow: 0 10px 15px -3px rgba(138, 163, 153, 0.2), 0 4px 6px -2px rgba(138, 163, 153, 0.1);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
            border-radius: 1rem; /* 柔和的邊角，但不像可愛風那麼圓 */
        }

        .card-shadow:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 25px -5px rgba(138, 163, 153, 0.3), 0 10px 10px -5px rgba(138, 163, 153, 0.15);
        }

        .card-shadow:active {
            transform: scale(0.98);
        }

        /* 首頁單元 Sage Style 漸層配色 */
        .home-unit-1 { background: linear-gradient(135deg, #a3b899 0%, #7d9e8d 100%); } /* 鼠尾草綠 */
        .home-unit-2 { background: linear-gradient(135deg, #d4b5b0 0%, #b8958f 100%); } /* 柔和陶土色 */
        .home-unit-3 { background: linear-gradient(135deg, #b0c4de 0%, #8fa8c8 100%); } /* 灰藍色 */
        .home-unit-4 { background: linear-gradient(135deg, #d9cd90 0%, #bfa860 100%); } /* 稻草黃 */
        .home-unit-5 { background: linear-gradient(135deg, #a8a0b1 0%, #8a7f96 100%); } /* 柔和紫灰 */
        .home-unit-default { background: linear-gradient(135deg, #a4acaa 0%, #838d8a 100%); } /* 石板灰 */

        .btn-white {
            background-color: #ffffff;
            color: #3e504c;
            border: 1px solid #e2e8e4;
            border-radius: 1rem;
        }

        /* Playing Animation */
        .playing {
            background-color: #f0f4cd !important; /* 柔和的淡黃綠 */
            border-color: #bfa860 !important;
            transform: scale(1.02) !important;
            box-shadow: 0 0 15px rgba(191, 168, 96, 0.3) !important;
            transition: all 0.3s ease;
        }

        /* Loading Screen (Sage Style) */
        #loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .sage-leaf {
            font-size: 4rem;
            color: #7d9e8d;
            animation: floatLeaf 2s ease-in-out infinite alternate;
        }

        @keyframes floatLeaf {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-15px) rotate(10deg); }
        }

        /* 標題區塊 Sage 漸層 */
        .sage-header {
            background: linear-gradient(135deg, #8ba79b 0%, #6c8a7c 100%);
            border-bottom-left-radius: 1rem;
            border-bottom-right-radius: 1rem;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Loading Screen -->
    <div id="loading-overlay">
        <div class="sage-leaf mb-4"><i class="fas fa-leaf"></i></div>
        <p class="text-[#6c8a7c] font-bold text-xl tracking-wider"> Loading...正在整理筆記... 🌿</p>
    </div>

    <!-- Header -->
    <header class="sage-header text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-3xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer hover:opacity-90 transition" onclick="goHome()">
                <div class="bg-white/20 rounded-lg p-2 w-12 h-12 flex items-center justify-center backdrop-blur-sm">
                    <i class="fas fa-book-reader text-2xl text-white"></i>
                </div>
                <h1 id="header-title" class="text-2xl font-bold tracking-wide">MyView Helper</h1>
            </div>
            <div class="flex items-center gap-2">
                <button id="navBtn" onclick="goBack()" class="hidden text-base bg-white/10 hover:bg-white/20 px-4 py-2 rounded-lg transition backdrop-blur-sm font-bold">
                    <i class="fas fa-arrow-left mr-1"></i> Back
                </button>
                <button onclick="toggleQuickNav()" class="bg-white/10 hover:bg-white/20 p-2 w-12 h-12 rounded-lg transition flex items-center justify-center backdrop-blur-sm" title="Quick Menu">
                    <i class="fas fa-bars text-xl"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Appears Here -->
    <main class="flex-grow p-4 max-w-3xl mx-auto w-full" id="app"></main>

    <!-- Footer -->
     <footer class="text-[#8ba79b] text-center p-6 text-sm font-medium">
        <p>Cultivating Knowledge 🌱 © 2026 MyView Helper</p>
    </footer>

    <!-- Global Stop Button -->
    <div id="stopFloatingBtn" class="fixed bottom-6 right-6 z-50 hidden">
        <button onclick="stopAllPlayback()" class="bg-[#d4b5b0] hover:bg-[#b8958f] text-white rounded-full w-16 h-16 shadow-lg flex items-center justify-center text-2xl transition-transform hover:scale-110">
            <i class="fas fa-stop"></i>
        </button>
    </div>

    <!-- Quick Nav Modal -->
    <div id="quick-nav-modal" class="fixed inset-0 z-[100] hidden">
        <div class="absolute inset-0 bg-[#3e504c]/40 backdrop-blur-sm transition-opacity" onclick="toggleQuickNav()"></div>
        <div class="absolute right-0 top-0 bottom-0 w-72 bg-[#fdfdfc] shadow-2xl transform transition-transform overflow-y-auto rounded-l-2xl border-l border-[#e2e8e4]">
            <div class="p-5 sage-header text-white flex justify-between items-center sticky top-0 z-10 shadow-sm rounded-none rounded-tl-xl">
                <h2 class="font-bold text-lg"><i class="fas fa-compass mr-2"></i> Quick Nav</h2>
                <button onclick="toggleQuickNav()" class="hover:text-gray-200 transition"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div id="quick-nav-list" class="p-5"></div>
        </div>
    </div>

    <script>
        // --------------------------------------------------------
        // 1. 本地測試資料 (Mock Data) 聲明
        // --------------------------------------------------------
        let mockData = null;

        // State
        let db = { grade1: [], grade2: [], exams: [] };
        let currentView = 'home'; 
        let currentGrade = null;
        let currentUnitGroup = null; 
        let currentUnit = null;
        let isPlayingSequence = false;
        let currentExam = null; 
        let availableVoices = [];
        let quizState = null; 

        // Initialization
        document.addEventListener('DOMContentLoaded', () => {
            initVoices();
            fetchDataFromDrive(); 
        });

        // --- GAS Data Fetching ---
        async function fetchDataFromDrive() {
            // 嘗試呼叫 GAS，如果沒有 google.script 物件 (即在本地環境)，則直接載入 Mock Data
            if (typeof google !== 'undefined' && google.script) {
                google.script.run
                    .withSuccessHandler(onDataLoaded)
                    .withFailureHandler(async error => {
                        console.warn("GAS fetch failed, falling back to mock data.", error);
                        try {
                            const response = await fetch('./mock_data.json');
                            const data = await response.json();
                            onDataLoaded(data);
                        } catch (err) {
                            onDataError(error);
                        }
                    })
                    .getAllDataFromDrive();
            } else {
                console.log("Running locally, loading mock data...");
                try {
                    let response;
                    try {
                        response = await fetch('./mock_data.json');
                    } catch (e) {
                        response = await fetch('../docs/mock_data.json');
                    }
                    const data = await response.json();
                    setTimeout(() => onDataLoaded(data), 500);
                } catch (err) {
                    console.error("Failed to load mock data:", err);
                    onDataError(err);
                }
            }
        }

        function onDataLoaded(cloudData) {
            console.log("Data loaded:", cloudData);
            db = cloudData;
            renderQuickNav(); // 產生快速導航選單
            
            // 隱藏 Loading 動畫
            const overlay = document.getElementById('loading-overlay');
            overlay.style.opacity = '0';
            overlay.style.transition = 'opacity 0.5s ease';
            setTimeout(() => overlay.style.display = 'none', 500);
            
            // 渲染首頁
            renderHome();
        }

        function onDataError(error) {
            const errorMessage = `
                <div class="text-[#b8958f] text-center mt-10 bg-white p-8 rounded-2xl shadow-md border border-[#e2e8e4]">
                    <i class="fas fa-leaf text-5xl mb-4 opacity-50"></i>
                    <p class="font-bold text-2xl">Connection Failed</p>
                    <p class="text-lg text-[#8a7f96] mt-2">${error.message || 'Please try again later.'}</p>
                    <button onclick="location.reload()" class="mt-6 px-6 py-3 bg-[#8ba79b] text-white text-lg font-bold rounded-xl hover:bg-[#6c8a7c] transition shadow-sm">Retry</button>
                </div>
            `;
            const loadingOverlay = document.getElementById('loading-overlay');
            if (loadingOverlay.style.display !== 'none') {
                loadingOverlay.innerHTML = errorMessage;
            } else {
                document.getElementById('app').innerHTML = errorMessage;
            }
        }

        // --- On-Demand Loading ---
        function showAppLoading(message = 'Loading...') {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="flex flex-col items-center justify-center h-64">
                    <i class="fas fa-seedling text-4xl text-[#a3b899] mb-4 animate-bounce"></i>
                    <p class="text-[#6c8a7c] font-bold text-xl tracking-wide">${message}</p>
                </div>
            `;
            // Scroll to top
            window.scrollTo(0, 0);
        }

        // --- Voice Logic 語音控制 ---
        function initVoices() {
            window.speechSynthesis.onvoiceschanged = () => {
                availableVoices = window.speechSynthesis.getVoices();
            };
            availableVoices = window.speechSynthesis.getVoices();
        }

        function getBestVoice(lang) {
            if (!availableVoices.length) availableVoices = window.speechSynthesis.getVoices();
            const langVoices = availableVoices.filter(v => v.lang.replace('_', '-').includes(lang));
            if (langVoices.length === 0) return null;
            const enhancedVoice = langVoices.find(v => 
                v.name.includes('Google') || 
                v.name.includes('Microsoft') || 
                v.name.includes('Premium') ||
                v.name.includes('Enhanced')
            );
            return enhancedVoice || langVoices[0];
        }

        function speakDual(enText, zhText, elementId, onComplete) {
            if (!('speechSynthesis' in window)) {
                alert("Speech synthesis is not supported in this browser.");
                return;
            }
            window.speechSynthesis.cancel();
            highlightCard(elementId);

            const enUtterance = new SpeechSynthesisUtterance(enText);
            enUtterance.lang = 'en-US';
            enUtterance.rate = 0.85; // 稍微放慢語速，適合兒童
            const bestEnVoice = getBestVoice('en');
            if (bestEnVoice) enUtterance.voice = bestEnVoice;

            const zhUtterance = new SpeechSynthesisUtterance(zhText);
            zhUtterance.lang = 'zh-TW';
            zhUtterance.rate = 1.0;
            const bestZhVoice = getBestVoice('zh');
            if (bestZhVoice) zhUtterance.voice = bestZhVoice;

            enUtterance.onend = () => {
                if (isPlayingSequence || !onComplete) {
                     window.speechSynthesis.speak(zhUtterance);
                }
            };
            enUtterance.onerror = () => window.speechSynthesis.speak(zhUtterance);
            zhUtterance.onend = () => {
                removeHighlight(elementId);
                if (onComplete) onComplete();
            };
            window.speechSynthesis.speak(enUtterance);
        }

        // 循序朗讀 (全部播放功能)
        function playAllSequence(items, startIndex, idPrefix) {
            if (startIndex >= items.length) {
                stopAllPlayback();
                return;
            }
            isPlayingSequence = true;
            document.getElementById('stopFloatingBtn').classList.remove('hidden');

            const item = items[startIndex];
            // 如果是標題分隔線 (沒有 en 或 word)，則跳過不朗讀
            if (!item.en && !item.word && typeof item !== 'string') {
                playAllSequence(items, startIndex + 1, idPrefix);
                return;
            }

            const elementId = `${idPrefix}-${startIndex}`;
            const el = document.getElementById(elementId);
            if(el) el.scrollIntoView({ behavior: "smooth", block: "center" });

            let enText = item.en || item.word;
            if (!enText && typeof item === 'string') enText = item; 

            if (item.def) enText += `. ${item.def}`;
            if (item.example) enText += `. Example: ${item.example}`; 

            let zhText = item.zh || '';
            if (item.zhDef) zhText += `。${item.zhDef}`;
            if (item.zhExample) zhText += `。例句：${item.zhExample}`;

            speakDual(enText, zhText, elementId, () => {
                if (isPlayingSequence) {
                    setTimeout(() => {
                        if (isPlayingSequence) playAllSequence(items, startIndex + 1, idPrefix);
                    }, 800);
                }
            });
        }

        function stopAllPlayback() {
            isPlayingSequence = false;
            window.speechSynthesis.cancel();
            document.getElementById('stopFloatingBtn').classList.add('hidden');
            document.querySelectorAll('.playing').forEach(el => el.classList.remove('playing'));
        }

        function highlightCard(elementId) {
            document.querySelectorAll('.playing').forEach(el => el.classList.remove('playing'));
            if (elementId) {
                const el = document.getElementById(elementId);
                if (el) el.classList.add('playing');
            }
        }

        function removeHighlight(elementId) {
            if (elementId) {
                const el = document.getElementById(elementId);
                if (el) el.classList.remove('playing');
            }
        }

        // --- Navigation 導覽控制 ---
        function updateNav(showBack) {
            const navBtn = document.getElementById('navBtn');
            if (showBack) navBtn.classList.remove('hidden');
            else navBtn.classList.add('hidden');
        }

        function goHome() {
            stopAllPlayback();
            currentView = 'home';
            currentGrade = null;
            currentUnitGroup = null;
            renderHome();
            updateNav(false);
        }

        function goBack() {
            stopAllPlayback();
            // 處理回到上一頁的邏輯
            if (currentView === 'unit_menu') {
                goHome(); 
            } else if (['highlights', 'fulltext', 'all_words'].includes(currentView)) {
                if (currentExam) {
                    renderExamDashboard(currentExam); // 如果在考試模式中，回考試儀表板
                } else {
                    renderUnitMenu(currentUnit); // 否則回到單元選單
                }
            } else if (currentView === 'grade_menu') {
                goHome();
            } else if (currentView === 'exam_dashboard') {
                renderExamList();
            } else if (currentView === 'exam_list') {
                goHome();
            } else if (['exam_quiz', 'quiz_result'].includes(currentView)) {
                renderExamDashboard(currentExam);
            }
        }

        // --- Navigation & Data Loading ---
        function toggleQuickNav() {
            const modal = document.getElementById('quick-nav-modal');
            modal.classList.toggle('hidden');
        }

        async function jumpToUnit(gradeDbKey, id) {
            toggleQuickNav();
            showAppLoading('Loading Unit...');
            try {
                const unit = await loadUnitData(gradeDbKey, id);
                renderUnitMenu(unit);
            } catch (error) {
                onDataError(error);
            }
        }

        function toggleGradeAccordion(btn) {
            const content = btn.nextElementSibling;
            const icon = btn.querySelector('i');
            content.classList.toggle('hidden');
            if (content.classList.contains('hidden')) {
                icon.className = 'fas fa-chevron-right text-xs text-[#7d9e8d]';
            } else {
                icon.className = 'fas fa-chevron-down text-xs text-[#7d9e8d]';
            }
        }

        // --- Data Retrieval (快取機制與 GAS 串接) ---
        async function loadUnitData(gradeDbKey, id) {
            const gradeData = db[gradeDbKey] || [];
            const unitIndex = gradeData.findIndex(u => u.id === id);
            if (unitIndex === -1) throw new Error(`Unit not found (${id})`);

            const unit = db[gradeDbKey][unitIndex];

            // 檢查是否已在快取中擁有完整資料
            if (unit.content === undefined) {
                if (typeof google !== 'undefined' && google.script) {
                    return new Promise((resolve) => {
                        google.script.run
                            .withSuccessHandler(fullUnitData => {
                                db[gradeDbKey][unitIndex] = fullUnitData;
                                resolve(fullUnitData);
                            })
                            .withFailureHandler(error => {
                                console.warn("GAS fetch failed for unit, using existing local data.", error);
                                resolve(unit);
                            })
                            .getUnitData(id, unit.fileId);
                    });
                } else {
                    // 本地測試時從 mock_data.json 獲取
                    console.log(`Running locally, trying to load unit ${id} from mock data...`);
                    let response;
                    try {
                        response = await fetch('./mock_data.json');
                    } catch (e) {
                        response = await fetch('../docs/mock_data.json');
                    }
                    const fallbackData = await response.json();
                    const gradeData = fallbackData[gradeDbKey] || [];
                    const fallbackUnit = gradeData.find(u => u.id === id);
                    if (fallbackUnit) {
                        db[gradeDbKey][unitIndex] = fallbackUnit;
                        return fallbackUnit;
                    }
                }
            }
            return unit;
        }

        // --- Renderers 渲染器 ---

        function renderQuickNav() {
            const list = document.getElementById('quick-nav-list');
            if (!list) return;
            
            let html = '';
            const grades = { 'Grade 1': db.grade1 || [], 'Grade 2': db.grade2 || [] };
            
            Object.keys(grades).forEach(gradeLabel => {
                const lessons = grades[gradeLabel];
                if (lessons.length === 0) return;

                // Group by Unit
                const units = {};
                lessons.forEach(l => {
                    if (!units[l.unit]) units[l.unit] = [];
                    units[l.unit].push(l);
                });

                // 預設將 Grade 1 收合 (collapsed)
                const isCollapsed = gradeLabel === 'Grade 1';
                const contentClass = isCollapsed ? 'hidden' : '';
                const iconClass = isCollapsed ? 'fa-chevron-right' : 'fa-chevron-down';

                // 調整為小字級: text-sm, text-xs
                html += `<div class="mb-4 bg-[#f4f7f6] p-3 rounded-xl border border-[#e2e8e4]">
                    <button onclick="toggleGradeAccordion(this)" class="w-full flex justify-between items-center font-bold text-[#3e504c] pb-1 text-sm focus:outline-none hover:text-[#6c8a7c] transition">
                        <span>${gradeLabel}</span>
                        <i class="fas ${iconClass} text-xs text-[#7d9e8d]"></i>
                    </button>
                    <div class="${contentClass} transition-all mt-2">`;
                
                Object.keys(units).sort((a,b) => parseInt(a)-parseInt(b)).forEach(unitNum => {
                    const unitLessons = units[unitNum];
                    unitLessons.sort((a,b) => a.week - b.week);
                    
                    html += `<div class="mb-2 bg-white p-2 rounded-lg shadow-sm border border-[#e2e8e4]/50">
                        <div class="text-xs font-bold text-[#8a7f96] uppercase tracking-wider mb-1 pl-1 border-b border-[#f4f7f6] pb-1">Unit ${unitNum}</div>
                        <div class="space-y-1">`;
                    
                    unitLessons.forEach(l => {
                        const gradeDbKey = gradeLabel === 'Grade 1' ? 'grade1' : 'grade2';
                        html += `
                            <button onclick="jumpToUnit('${gradeDbKey}', '${l.id}')" class="block w-full text-left text-sm font-medium text-[#6c8a7c] hover:bg-[#f0f4cd] hover:text-[#3e504c] px-2 py-1.5 rounded transition truncate flex items-center">
                                <span class="font-mono text-xs font-bold bg-[#e2e8e4] text-[#6c8a7c] px-1 rounded mr-2">W${l.week}</span>
                                <span class="truncate">${l.title}</span>
                            </button>
                        `;
                    });
                    
                    html += `</div></div>`;
                });
                html += `</div></div>`;
            });
            
            list.innerHTML = html;
        }

        // 首頁：列出所有單元 (Grade X, Unit Y)
        function renderHome() {
            currentView = 'home';
            const app = document.getElementById('app');
            currentExam = null; // 清除考試狀態
            
            // Check if db is empty (error handling or empty state)
            if (!db.grade1.length && !db.grade2.length) {
                app.innerHTML = `<div class="text-center text-[#8a7f96] mt-10 font-bold text-xl"><i class="fas fa-wind text-4xl mb-3 block opacity-50"></i> No Data Available</div>`;
                return;
            }

            // 整理資料：找出所有存在的 Grade 和 Unit
            // 結構: groups['Grade 1']['Unit 5'] = [lessons...]
            const groups = {};

            const processLessons = (lessons, gradeLabel) => {
                lessons.forEach(lesson => {
                    const unitKey = `Unit ${lesson.unit}`;
                    if (!groups[gradeLabel]) groups[gradeLabel] = {};
                    if (!groups[gradeLabel][unitKey]) groups[gradeLabel][unitKey] = [];
                    groups[gradeLabel][unitKey].push(lesson);
                });
            };

            processLessons(db.grade1, 'Grade 1');
            processLessons(db.grade2, 'Grade 2');

            let html = `
                <div class="mb-8 text-center animate-fade-in mt-4">
                    <h2 class="text-3xl font-bold text-[#3e504c] tracking-wide">Select Learning Area</h2>
                    <p class="text-[#8ba79b] font-bold mt-2 text-lg">Choose a unit to begin</p>
                </div>
                <div class="space-y-6 px-1">
            `;

            // 產生按鈕
            Object.keys(groups).sort().forEach(gradeKey => {
                const units = groups[gradeKey];
                const sortedUnits = Object.keys(units).sort((a, b) => parseInt(a.replace('Unit ', '')) - parseInt(b.replace('Unit ', '')));

                sortedUnits.forEach(unitKey => {
                    const unitNum = parseInt(unitKey.replace('Unit ', ''));
                    // 根據 Unit 號碼決定 CSS Class (1~5, 超過5用 default)
                    const colorClass = (gradeKey !== 'Grade 1' && unitNum >= 1 && unitNum <= 5) ? `home-unit-${unitNum}` : 'home-unit-default';
                    const lessonCount = units[unitKey].length;

                    html += `
                        <button onclick="renderGradeMenu('${gradeKey}', '${unitKey}')" class="${colorClass} w-full text-white rounded-[1.5rem] p-6 shadow-md transform transition hover:-translate-y-1 flex items-center justify-between group border border-white/20">
                        <div class="text-left">
                                <h3 class="text-3xl font-bold mb-2 tracking-wide">${gradeKey}, ${unitKey}</h3>
                                <p class="text-white/90 text-sm font-bold bg-black/10 inline-block px-3 py-1.5 rounded-lg backdrop-blur-sm">${lessonCount} Lessons Available</p>
                        </div>
                            <div class="bg-white/20 p-4 rounded-2xl backdrop-blur-sm group-hover:bg-white/30 transition">
                                <i class="fas fa-layer-group text-3xl"></i>
                </div>
                        </button>
            `;
                });
            });

            // 綜合評量測驗區塊
            html += `
                <div class="mt-10 border-t-2 border-[#e2e8e4] pt-8">
                    <button onclick="renderExamList()" class="w-full bg-gradient-to-r from-[#bfa860] to-[#d9cd90] text-white rounded-[1.5rem] p-6 shadow-md transform transition hover:-translate-y-1 flex items-center justify-between group border border-white/20">

        // 共用的列表渲染函數 (用於 Highlights 和 Full Text)

        // 整合單字卡區塊：按順序 1. Spelling 2. HFW 3. Vocabulary
        function renderAllWords() {
            currentView = 'all_words'; // 設定正確的 view 狀態，讓 goBack 可以辨識
            const app = document.getElementById('app');
            let fullHtml = '';

            // 1. Spelling Words

            if (currentUnit.HFW && currentUnit.HFW.length > 0) {

                fullHtml += generateWordSectionHtml('High Frequency Words', currentUnit.HFW, 'hfw', 'sage-blue');
            }

            // 3. Vocabulary
            if (currentUnit.vocab && currentUnit.vocab.length > 0) {
                if (fullHtml) fullHtml += '<div class="h-10"></div>';
                fullHtml += generateWordSectionHtml('Vocabulary', currentUnit.vocab, 'vocab', 'sage-green');

            app.innerHTML = `<div class="pb-24">${fullHtml}</div>`;

        // 輔助函式：根據 ranges 取得所有單元
        async function getUnitsFromRanges(ranges) {
            showAppLoading('Loading Content...');
            const unitPromises = ranges.map(id => {
                const gradeKey = id.startsWith('1_') ? 'grade1' : 'grade2';
                return loadUnitData(gradeKey, id).catch(() => null);
            });
            const units = await Promise.all(unitPromises);
            return units.filter(u => u !== null);
        }

        // 考試複習專用的整合單字卡區塊
        async function enterExamAllWords() {
            showAppLoading('Compiling Words...');
            const units = await getUnitsFromRanges(currentExam.ranges);
            let aggregatedVocab = [];
            let aggregatedSpelling = [];
            let aggregatedHFW = [];

            // 把各單元的資料加入並標上所屬的 Unit Title 作為子標題分隔
            units.forEach(u => {
                if (u.spelling && u.spelling.length > 0) {
                    aggregatedSpelling.push({ title: `📖 ${u.title}` });
                    aggregatedSpelling = aggregatedSpelling.concat(u.spelling);
                }
                if (u.HFW && u.HFW.length > 0) {
                    aggregatedHFW.push({ title: `📖 ${u.title}` });
                    aggregatedHFW = aggregatedHFW.concat(u.HFW);
                }
                if (u.vocab && u.vocab.length > 0) {
                    aggregatedVocab.push({ title: `📖 ${u.title}` });
                    aggregatedVocab = aggregatedVocab.concat(u.vocab);
                }
            });

            currentUnit = { 
                title: "Words Flashcards", 
                spelling: aggregatedSpelling,
                HFW: aggregatedHFW,
                vocab: aggregatedVocab
            };
            renderAllWords();
        }

        // 共用單字與例句渲染 (依據不同類別改變色彩)
        function generateWordSectionHtml(title, rawList, idPrefix, colorName) {
            // Sage Style mappings for sub-sections
            let btnBg = 'bg-[#8ba79b]', btnHover = 'hover:bg-[#6c8a7c]', borderHover = 'hover:border-[#a3b899]', iconColor = 'text-[#6c8a7c]', exBorder = 'border-[#a3b899]', exColor = 'text-[#a3b899]';
            if (colorName === 'sage-clay') {
                btnBg = 'bg-[#d4b5b0]'; btnHover = 'hover:bg-[#b8958f]'; borderHover = 'hover:border-[#d4b5b0]'; iconColor = 'text-[#b8958f]'; exBorder = 'border-[#d4b5b0]'; exColor = 'text-[#b8958f]';
            } else if (colorName === 'sage-blue') {
                btnBg = 'bg-[#8fa8c8]'; btnHover = 'hover:bg-[#6f8eb3]'; borderHover = 'hover:border-[#8fa8c8]'; iconColor = 'text-[#6f8eb3]'; exBorder = 'border-[#8fa8c8]'; exColor = 'text-[#8fa8c8]';
            }

            let html = `
                <div class="mb-6 sticky top-16 bg-[#f4f7f6]/90 py-3 z-10 -mx-4 px-5 backdrop-blur-sm border-b-2 border-[#e2e8e4]">
                    <div class="text-xs font-bold text-[#8ba79b] mb-1">${currentUnit.title}</div>
                    <div class="flex items-center justify-between">
                        <h2 class="text-2xl font-bold text-[#3e504c]">${title}</h2>
                        <button onclick="playAllSequence(currentUnit['${idPrefix}'], 0, '${idPrefix}')" class="${btnBg} ${btnHover} text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md transition flex items-center">
                            <i class="fas fa-play text-xs mr-2"></i> Play All
                        </button>
                    </div>
                </div>
                <div class="space-y-5 px-1">
            `;

            rawList.forEach((item, index) => {
                // 如果遇到純標題項目 (例如考前複習中的單元名稱分隔)
                if (item.title && !item.word) {
                    html += `<h3 class="text-lg font-bold text-[#6c8a7c] mt-8 mb-3 ml-2 opacity-80 uppercase tracking-wide border-b-2 border-[#e2e8e4] pb-2">${item.title}</h3>`;
                    return;
                }

                const cardId = `${idPrefix}-${index}`;
                
                let enSpeak = `${item.word}. ${item.def || ''}`;
                if (item.example) enSpeak += ` Example: ${item.example}`;
                let zhSpeak = `${item.zh}. ${item.zhDef || ''}`;
                if (item.zhExample) zhSpeak += ` 例句：${item.zhExample}`;
                
                html += `
                    <div id="${cardId}" class="bg-white p-6 rounded-2xl card-shadow border-l-[5px] border-transparent ${borderHover} transition-colors">
                        <div class="flex justify-between items-start mb-2">
                            <div class="pr-3">
                                <div class="flex items-end gap-3 mb-2">
                                    <h3 class="text-3xl font-extrabold text-[#3e504c] tracking-wide">${item.word}</h3>
                                    <span class="text-[#8ba79b] font-bold text-lg mb-0.5">${item.zh}</span>
                                </div>
                                <p class="text-[#3e504c] text-lg mb-1.5 font-semibold">${item.def || ''}</p>
                                <p class="text-[#6c8a7c] text-base font-medium">${item.zhDef || ''}</p>
                            </div>
                            <button onclick="stopAllPlayback(); speakDual(\`${escapeForHtml(enSpeak)}\`, \`${escapeForHtml(zhSpeak)}\`, '${cardId}')" class="flex-shrink-0 w-12 h-12 bg-[#f4f7f6] ${iconColor} rounded-full flex items-center justify-center ${btnHover} hover:text-white transition shadow-sm mt-1">
                                <i class="fas fa-volume-up text-lg"></i>
                            </button>
                        </div>
                        
                        ${item.example ? `
                        <div class="mt-4 bg-[#fcfdfa] p-4 rounded-xl border-2 border-[#e2e8e4]/70">
                            <p class="text-[#3e504c] mb-1 text-base font-bold"><span class="${exColor} text-xs border-2 ${exBorder} px-1.5 py-0.5 rounded mr-2 uppercase font-extrabold">Ex</span>${item.example}</p>
                            <p class="text-[#8a7f96] text-sm pl-8 font-medium">${item.zhExample || ''}</p>
                        </div>
                        ` : ''}
                    </div>
                `;
            });
            html += `</div>`;
            return html;
        }

        // --- Quiz Logic ---

        async function enterExamQuiz() {
            showAppLoading('Preparing Quiz...');
            const units = await getUnitsFromRanges(currentExam.ranges);
            let allVocab = [];
            units.forEach(u => { 
                if (u.vocab) allVocab = allVocab.concat(u.vocab); 
                if (u.spelling) allVocab = allVocab.concat(u.spelling);
                if (u.HFW) allVocab = allVocab.concat(u.HFW);
            });

            // 簡單去重 (依據單字拼寫)
            const uniqueVocab = [];
            const seenWords = new Set();
            allVocab.forEach(v => {
                if (v.word && v.zh) {
                const wordKey = v.word.toLowerCase().trim();
                if (!seenWords.has(wordKey)) {
                    seenWords.add(wordKey);
                    uniqueVocab.push(v);
                    }
                }
            });

            if (uniqueVocab.length < 4) {
                alert("Not enough vocabulary words (minimum 4 required).");
                renderExamDashboard(currentExam);
                return;
            }

            // 洗牌並取出最多 20 題
            uniqueVocab.sort(() => Math.random() - 0.5);
            const quizItems = uniqueVocab.slice(0, 20);

            // 產生題目與選項
            const questions = quizItems.map(target => {
                // 隨機選 3 個干擾項
                const distractors = uniqueVocab
                    .filter(v => v.word !== target.word)
                    .sort(() => Math.random() - 0.5)
                    .slice(0, 3);
                
                // 混合選項並再次洗牌
                const options = [target, ...distractors].sort(() => Math.random() - 0.5);
                return { target, options };
            });

            quizState = {
                questions,
                currentIndex: 0,
                score: 0,
                type: 'multiple_choice'
            };

            renderQuizQuestion();
        }

        function renderQuizQuestion() {
            currentView = 'exam_quiz';
            const app = document.getElementById('app');
            updateNav(true);

            const q = quizState.questions[quizState.currentIndex];
            const progress = `${quizState.currentIndex + 1} / ${quizState.questions.length}`;

            let html = `
                <div class="animate-fade-in max-w-xl mx-auto px-1">
                    <div class="mb-5 flex justify-between items-center border-b-2 border-[#e2e8e4] pb-3">
                        <span class="text-[#8ba79b] font-bold text-base">Question ${progress}</span>
                        <span class="text-[#bfa860] font-bold text-base">Score: ${quizState.score}</span>
                    </div>

                    <div class="bg-white rounded-3xl shadow-sm p-10 text-center mb-8 border border-[#e2e8e4]">
                        <p class="text-[#8a7f96] text-sm font-bold mb-3">Select the correct Chinese meaning:</p>
                        <h2 class="text-4xl font-extrabold text-[#3e504c] mb-8 tracking-wide">${q.target.word}</h2>
                        <button onclick="speakDual('${escapeForHtml(q.target.word)}', '', null)" class="text-[#6c8a7c] hover:bg-[#f4f7f6] border-2 border-[#e2e8e4] text-2xl transition w-16 h-16 rounded-full flex items-center justify-center mx-auto shadow-sm">
                            <i class="fas fa-volume-up"></i>
                        </button>
                    </div>

                    <div class="grid grid-cols-1 gap-4">
            `;

            q.options.forEach((opt, idx) => {
                const letters = ['A', 'B', 'C', 'D'];
                html += `
                    <button id="quiz-opt-${idx}" onclick="checkQuizAnswer(${idx})" class="bg-white border-2 border-[#e2e8e4] hover:border-[#8ba79b] hover:bg-[#fcfdfa] text-[#3e504c] rounded-2xl p-5 text-left transition flex items-center shadow-sm">
                        <div class="text-[#8ba79b] font-bold w-8 text-lg">${letters[idx]}.</div>
                        <span class="flex-grow text-xl font-bold">${opt.zh}</span>
                    </button>
                `;
            });

            html += `</div></div>`;
            app.innerHTML = html;
        }

        function checkQuizAnswer(selectedIndex) {
            const q = quizState.questions[quizState.currentIndex];
            const isCorrect = q.options[selectedIndex].word === q.target.word;

            // 鎖定所有按鈕並顯示正確答案
            q.options.forEach((opt, idx) => {
                const btn = document.getElementById(`quiz-opt-${idx}`);
                btn.disabled = true;
                btn.classList.remove('hover:border-[#8ba79b]', 'hover:bg-[#fcfdfa]'); 
                
                if (opt.word === q.target.word) {
                    btn.classList.add('bg-[#f0f4cd]', 'border-[#bfa860]', 'text-[#3e504c]');
                    btn.innerHTML += ` <i class="fas fa-check text-[#bfa860] text-2xl float-right ml-auto"></i>`;
                } else if (idx === selectedIndex && !isCorrect) {
                    btn.classList.add('bg-[#f0e8eb]', 'border-[#d4b5b0]', 'text-[#b8958f]');
                    btn.innerHTML += ` <i class="fas fa-times text-[#d4b5b0] text-2xl float-right ml-auto"></i>`;
                }
            });

            if (isCorrect) quizState.score++;

            // 延遲後進入下一題
            setTimeout(() => {
                quizState.currentIndex++;
                if (quizState.currentIndex < quizState.questions.length) {
                    renderQuizQuestion();
                } else {
                    renderQuizResult('multiple_choice');
                }
            }, 1200);
        }

        async function enterSpellingQuiz() {
            showAppLoading('Preparing Spelling Test...');
            const units = await getUnitsFromRanges(currentExam.ranges);
            let allWords = [];
            units.forEach(u => {
                if (u.vocab) allWords = allWords.concat(u.vocab);
                if (u.spelling) allWords = allWords.concat(u.spelling);
                if (u.HFW) allWords = allWords.concat(u.HFW);
            });

            const uniqueWords = [];
            const seenWords = new Set();
            allWords.forEach(v => {
                // Only include words with definitions for this quiz type
                if (v.word && v.def) {
                    const wordKey = v.word.toLowerCase().trim();
                    if (!seenWords.has(wordKey)) {
                        seenWords.add(wordKey);
                        uniqueWords.push(v);
                    }
                }
            });

            if (uniqueWords.length < 1) {
                alert("No words available for test within range.");
                renderExamDashboard(currentExam);
                return;
            }

            uniqueWords.sort(() => Math.random() - 0.5);
            const quizItems = uniqueWords.slice(0, 20);

            quizState = { questions: quizItems.map(item => ({ target: item })), currentIndex: 0, score: 0, type: 'spelling' };
            renderSpellingQuestion();
        }

        function renderSpellingQuestion() {
            currentView = 'exam_quiz';
            const app = document.getElementById('app');
            updateNav(true);

            const q = quizState.questions[quizState.currentIndex];
            const progress = `${quizState.currentIndex + 1} / ${quizState.questions.length}`;

            let html = `
                <div class="animate-fade-in max-w-xl mx-auto px-1">
                    <div class="mb-5 flex justify-between items-center border-b-2 border-[#e2e8e4] pb-3">
                        <span class="text-[#8ba79b] font-bold text-base">Question ${progress}</span>
                        <span class="text-[#bfa860] font-bold text-base">Score: ${quizState.score}</span>
                    </div>

                    <div class="bg-white rounded-3xl shadow-sm p-8 mb-8 border border-[#e2e8e4] text-center">
                        <p class="text-[#8a7f96] text-sm font-bold mb-4">Definition & Hint:</p>
                        <h2 class="text-xl font-bold text-[#3e504c] mb-6 leading-relaxed">${q.target.def}</h2>
                        <button onclick="speakDual('${escapeForHtml(q.target.word)}', '', null)" class="text-[#6c8a7c] hover:bg-[#f4f7f6] border-2 border-[#e2e8e4] text-2xl transition w-16 h-16 rounded-full flex items-center justify-center mx-auto shadow-sm">
                            <i class="fas fa-volume-up"></i>
                        </button>
                    </div>

                    <div id="spelling-input-area" class="space-y-5">
                        <input id="spelling-input" type="text" placeholder="Type word here..."
                               class="w-full text-center text-3xl font-bold p-5 rounded-2xl border-2 border-[#e2e8e4] focus:border-[#8ba79b] outline-none text-[#3e504c] bg-[#fcfdfa] shadow-inner"
                               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                        <button onclick="checkSpellingAnswer()" class="w-full bg-[#8ba79b] hover:bg-[#6c8a7c] text-white py-4 rounded-2xl text-xl font-bold transition shadow-md">
                            Submit
                        </button>
                    </div>
                </div>
            `;
            app.innerHTML = html;
            
            const inputEl = document.getElementById('spelling-input');
            inputEl.focus();
            inputEl.addEventListener('keyup', (event) => {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    checkSpellingAnswer();
                }
            });
            
            setTimeout(() => speakDual(q.target.word, '', null), 400);
        }

        function checkSpellingAnswer() {
            const inputEl = document.getElementById('spelling-input');
            const userAnswer = inputEl.value.trim().toLowerCase();
            const correctAnswer = quizState.questions[quizState.currentIndex].target.word.toLowerCase();
            const isCorrect = userAnswer === correctAnswer;

            document.getElementById('spelling-input-area').innerHTML = `
                <div class="w-full text-center text-3xl font-bold p-5 rounded-2xl border-2 ${isCorrect ? 'bg-[#f0f4cd] border-[#bfa860] text-[#3e504c]' : 'bg-[#f0e8eb] border-[#d4b5b0] text-[#b8958f]'} shadow-inner">
                    ${inputEl.value || '(Empty)'} ${isCorrect ? '<i class="fas fa-check ml-3"></i>' : '<i class="fas fa-times ml-3"></i>'}
                </div>
                ${!isCorrect ? `<div class="text-[#6c8a7c] text-center text-base font-bold mt-4">Correct Answer: <span class="font-extrabold tracking-wider text-xl text-[#3e504c] block mt-1">${quizState.questions[quizState.currentIndex].target.word}</span></div>` : ''}
            `;

            if (isCorrect) quizState.score++;

            setTimeout(() => {
                quizState.currentIndex++;
                if (quizState.currentIndex < quizState.questions.length) {
                    renderSpellingQuestion();
                } else {
                    renderQuizResult('spelling');
                }
            }, isCorrect ? 1000 : 2500);
        }

        function renderQuizResult(quizType) {
            currentView = 'quiz_result';
            const app = document.getElementById('app');
            const score = quizState.score;
            const total = quizState.questions.length;
            const percentage = Math.round((score / total) * 100);
            
            let message = '';
            let colorClass = '';

            if (percentage === 100) {
                message = 'Perfect Score! Amazing! 🎉';
                
            } else if (percentage >= 80) {
                message = 'Great job! Keep it up! 👍';
                colorClass = 'text-[#bfa860]';
            } else if (percentage >= 60) {
                message = 'Not bad! A little more practice! 💪';
                colorClass = 'text-[#7d9e8d]';
            } else {
                message = 'You can do it! Review and try again! 📚';
                colorClass = 'text-[#b8958f]';
            }
            const retryFunction = quizType === 'spelling' ? 'enterSpellingQuiz()' : 'enterExamQuiz()';

            app.innerHTML = `
                <div class="animate-fade-in text-center py-12 px-4">
                    <i class="fas fa-seedling text-6xl ${colorClass} mb-6 animate-bounce"></i>
                    <h2 class="text-5xl font-extrabold text-[#3e504c] mb-3">${score} <span class="text-2xl text-[#8a7f96]">/ ${total}</span></h2>
                    <p class="text-[#8ba79b] text-lg font-bold mb-8">Accuracy ${percentage}%</p>
                    
                    <p class="text-2xl font-bold ${colorClass} mb-12 bg-white p-4 rounded-2xl shadow-sm border border-[#e2e8e4] inline-block">${message}</p>

                    <div class="space-y-5 max-w-sm mx-auto">
                        <button onclick="${retryFunction}" class="w-full bg-[#8ba79b] hover:bg-[#6c8a7c] text-white py-4 rounded-2xl text-xl font-bold shadow-md transition">
                            Retry
                        </button>
                        <button onclick="renderExamDashboard(currentExam)" class="w-full bg-white text-[#6c8a7c] border-2 border-[#e2e8e4] py-4 rounded-2xl text-xl font-bold hover:bg-[#f4f7f6] transition">
                            Back to Menu
                        </button>
                    </div>
                </div>
            `;
        }

        // Utils 字串跳脫與色彩映射
        function escapeForHtml(str) {
            if (!str) return '';
            return str.replace(/`/g, '\\`').replace(/"/g, '&quot;');
        }

        // 小工具：協助在 JS 中生成 Tailwind 的 border-color 樣式 (解決 JIT 問題的折衷方案)
        // 因為我們用的是 CDN JIT，直接寫 class="border-blue-500" 只要 CDN 掃得到就可以。
        // 但為了保險，這裡做一個簡單的 map 應付 renderGradeMenu 的 style 屬性
        function tailwindColorMap(colorName) {
            // 對應至 Sage 柔和色系
            const colors = {
                'sage-green': '#8ba79b', 
                'sage-clay': '#d4b5b0', 
                'sage-blue': '#8fa8c8', 
                'sage-straw': '#d9cd90',
                'sage-purple': '#a8a0b1',
                'amber-500': '#d9cd90', 
                'pink-400': '#d4b5b0', 
                'sky-400': '#8fa8c8', 
                'blue-400': '#8fa8c8', 
                'emerald-400': '#8ba79b'
            };
            return colors[colorName] || '#8ba79b';
        }
    </script>
</body>
</html>

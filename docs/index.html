<html lang="zh-TW">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Sage Style Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        body {
            /* Sage Style: 柔和的鼠尾草綠與大地色系 */
            font-family: 'Quicksand', 'Noto Sans TC', sans-serif;
            background-color: #f4f7f6; /* 極淺的灰綠色 */
            -webkit-tap-highlight-color: transparent;
            color: #3e504c; /* 深鼠尾草綠 */
        }

        .card-shadow {
            box-shadow: 0 10px 15px -3px rgba(138, 163, 153, 0.2), 0 4px 6px -2px rgba(138, 163, 153, 0.1);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
            border-radius: 1rem; /* 柔和的邊角，但不像可愛風那麼圓 */
        }

        .card-shadow:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 25px -5px rgba(138, 163, 153, 0.3), 0 10px 10px -5px rgba(138, 163, 153, 0.15);
        }

        .card-shadow:active {
            transform: scale(0.98);
        }

        /* 首頁單元 Sage Style 漸層配色 */
        .home-unit-1 { background: linear-gradient(135deg, #a3b899 0%, #7d9e8d 100%); } /* 鼠尾草綠 */
        .home-unit-2 { background: linear-gradient(135deg, #d4b5b0 0%, #b8958f 100%); } /* 柔和陶土色 */
        .home-unit-3 { background: linear-gradient(135deg, #b0c4de 0%, #8fa8c8 100%); } /* 灰藍色 */
        .home-unit-4 { background: linear-gradient(135deg, #d9cd90 0%, #bfa860 100%); } /* 稻草黃 */
        .home-unit-5 { background: linear-gradient(135deg, #a8a0b1 0%, #8a7f96 100%); } /* 柔和紫灰 */
        .home-unit-default { background: linear-gradient(135deg, #a4acaa 0%, #838d8a 100%); } /* 石板灰 */

        .btn-white {
            background-color: #ffffff;
            color: #3e504c;
            border: 1px solid #e2e8e4;
            border-radius: 1rem;
        }

        /* Playing Animation */
        .playing {
            background-color: #f0f4cd !important; /* 柔和的淡黃綠 */
            border-color: #bfa860 !important;
            transform: scale(1.02) !important;
            box-shadow: 0 0 15px rgba(191, 168, 96, 0.3) !important;
            transition: all 0.3s ease;
        }

        /* Loading Screen (Sage Style) */
        #loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .sage-leaf {
            font-size: 4rem;
            color: #7d9e8d;
            animation: floatLeaf 2s ease-in-out infinite alternate;
        }

        @keyframes floatLeaf {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-15px) rotate(10deg); }
        }

        /* 標題區塊 Sage 漸層 */
        .sage-header {
            background: linear-gradient(135deg, #8ba79b 0%, #6c8a7c 100%);
            border-bottom-left-radius: 1rem;
            border-bottom-right-radius: 1rem;
        }
    </style>
</head>

        // --- Voice Logic 語音控制 ---
        function initVoices() {
            window.speechSynthesis.onvoiceschanged = () => {
                availableVoices = window.speechSynthesis.getVoices();
            };
            availableVoices = window.speechSynthesis.getVoices();
        }

        function getBestVoice(lang) {
            if (!availableVoices.length) availableVoices = window.speechSynthesis.getVoices();
            const langVoices = availableVoices.filter(v => v.lang.replace('_', '-').includes(lang));
            if (langVoices.length === 0) return null;
            const enhancedVoice = langVoices.find(v => 
                v.name.includes('Google') || 
                v.name.includes('Microsoft') || 
                v.name.includes('Premium') ||
                v.name.includes('Enhanced')
            );
            return enhancedVoice || langVoices[0];
        }

        function speakDual(enText, zhText, elementId, onComplete) {
            if (!('speechSynthesis' in window)) {
                alert("Speech synthesis is not supported in this browser.");
                return;
            }
            window.speechSynthesis.cancel();
            highlightCard(elementId);

            const enUtterance = new SpeechSynthesisUtterance(enText);
            enUtterance.lang = 'en-US';
            enUtterance.rate = 0.85; // 稍微放慢語速，適合兒童
            const bestEnVoice = getBestVoice('en');
            if (bestEnVoice) enUtterance.voice = bestEnVoice;

            const zhUtterance = new SpeechSynthesisUtterance(zhText);
            zhUtterance.lang = 'zh-TW';
            zhUtterance.rate = 1.0;
            const bestZhVoice = getBestVoice('zh');
            if (bestZhVoice) zhUtterance.voice = bestZhVoice;

            enUtterance.onend = () => {
                if (isPlayingSequence || !onComplete) {
                     window.speechSynthesis.speak(zhUtterance);
                }
            };
            enUtterance.onerror = () => window.speechSynthesis.speak(zhUtterance);
            zhUtterance.onend = () => {
                removeHighlight(elementId);
                if (onComplete) onComplete();
            };
            window.speechSynthesis.speak(enUtterance);
        }

        // 循序朗讀 (全部播放功能)
        function playAllSequence(items, startIndex, idPrefix) {
            if (startIndex >= items.length) {
                stopAllPlayback();
                return;
            }
            isPlayingSequence = true;
            document.getElementById('stopFloatingBtn').classList.remove('hidden');

            const item = items[startIndex];
            // 如果是標題分隔線 (沒有 en 或 word)，則跳過不朗讀
            if (!item.en && !item.word && typeof item !== 'string') {
                playAllSequence(items, startIndex + 1, idPrefix);
                return;
            }

            const elementId = `${idPrefix}-${startIndex}`;
            const el = document.getElementById(elementId);
            if(el) el.scrollIntoView({ behavior: "smooth", block: "center" });

            let enText = item.en || item.word;
            if (!enText && typeof item === 'string') enText = item; 

            if (item.def) enText += `. ${item.def}`;
            if (item.example) enText += `. Example: ${item.example}`; 

            let zhText = item.zh || '';
            if (item.zhDef) zhText += `。${item.zhDef}`;
            if (item.zhExample) zhText += `。例句：${item.zhExample}`;

            speakDual(enText, zhText, elementId, () => {
                if (isPlayingSequence) {
                    setTimeout(() => {
                        if (isPlayingSequence) playAllSequence(items, startIndex + 1, idPrefix);
                    }, 800);
                }
            });
        }

        function stopAllPlayback() {
            isPlayingSequence = false;
            window.speechSynthesis.cancel();
            document.getElementById('stopFloatingBtn').classList.add('hidden');
            document.querySelectorAll('.playing').forEach(el => el.classList.remove('playing'));
        }

        function highlightCard(elementId) {
            document.querySelectorAll('.playing').forEach(el => el.classList.remove('playing'));
            if (elementId) {

            }

        function removeHighlight(elementId) {

        // 2026-03-24 更新：增加從 GAS API 抓取單一單元資料的功能，並更新快取
        async function loadUnitData(gradeDbKey, id) {
            const gradeData = db[gradeDbKey] || [];
            const unitIndex = gradeData.findIndex(u => u.id === id);
            if (unitIndex === -1) throw new Error(`Unit not found (${id})`);

            const unit = db[gradeDbKey][unitIndex];

            // 關鍵修正：在 GitHub Pages 上，必須改用 fetch 抓取單一單元資料
            if (unit.content === undefined) {
                console.log(`正在從 API 抓取單元詳情: ${id}`);
                const response = await fetch(`${GAS_API_URL}?type=json&id=${id}`);
                const fullUnitData = await response.json();
                
                // 更新快取
                db[gradeDbKey][unitIndex] = fullUnitData;
                return fullUnitData;
            }
            return unit;

        }

        // --- Quiz Logic ---

        async function enterExamQuiz() {
            showAppLoading('Preparing Quiz...');
            const units = await getUnitsFromRanges(currentExam.ranges);
            let allVocab = [];
            units.forEach(u => { 
                if (u.vocab) allVocab = allVocab.concat(u.vocab); 
                if (u.spelling) allVocab = allVocab.concat(u.spelling);
                if (u.HFW) allVocab = allVocab.concat(u.HFW);
            });

            // 簡單去重 (依據單字拼寫)
            const uniqueVocab = [];
            const seenWords = new Set();
            allVocab.forEach(v => {
                if (v.word && v.zh) {
                const wordKey = v.word.toLowerCase().trim();
                if (!seenWords.has(wordKey)) {
                    seenWords.add(wordKey);
                    uniqueVocab.push(v);
                    }
                }
            });

            if (uniqueVocab.length < 4) {
                alert("Not enough vocabulary words (minimum 4 required).");
                renderExamDashboard(currentExam);
                return;
            }

            // 洗牌並取出最多 20 題
            uniqueVocab.sort(() => Math.random() - 0.5);
            const quizItems = uniqueVocab.slice(0, 20);

            // 產生題目與選項
            const questions = quizItems.map(target => {
                // 隨機選 3 個干擾項
                const distractors = uniqueVocab
                    .filter(v => v.word !== target.word)
                    .sort(() => Math.random() - 0.5)
                    .slice(0, 3);
                
                // 混合選項並再次洗牌
                const options = [target, ...distractors].sort(() => Math.random() - 0.5);
                return { target, options };
            });

            quizState = {
                questions,
                currentIndex: 0,
                score: 0,
                type: 'multiple_choice'
            };

            renderQuizQuestion();
        }

        function renderQuizQuestion() {
            currentView = 'exam_quiz';
            const app = document.getElementById('app');
            updateNav(true);

            const q = quizState.questions[quizState.currentIndex];
            const progress = `${quizState.currentIndex + 1} / ${quizState.questions.length}`;

            let html = `
                <div class="animate-fade-in max-w-xl mx-auto px-1">
                    <div class="mb-5 flex justify-between items-center border-b-2 border-[#e2e8e4] pb-3">
                        <span class="text-[#8ba79b] font-bold text-base">Question ${progress}</span>
                        <span class="text-[#bfa860] font-bold text-base">Score: ${quizState.score}</span>
                    </div>

                    <div class="bg-white rounded-3xl shadow-sm p-10 text-center mb-8 border border-[#e2e8e4]">
                        <p class="text-[#8a7f96] text-sm font-bold mb-3">Select the correct Chinese meaning:</p>
                        <h2 class="text-4xl font-extrabold text-[#3e504c] mb-8 tracking-wide">${q.target.word}</h2>
                        <button onclick="speakDual('${escapeForHtml(q.target.word)}', '', null)" class="text-[#6c8a7c] hover:bg-[#f4f7f6] border-2 border-[#e2e8e4] text-2xl transition w-16 h-16 rounded-full flex items-center justify-center mx-auto shadow-sm">
                            <i class="fas fa-volume-up"></i>
                        </button>
                    </div>

                    <div class="grid grid-cols-1 gap-4">
            `;

            q.options.forEach((opt, idx) => {
                const letters = ['A', 'B', 'C', 'D'];
                html += `
                    <button id="quiz-opt-${idx}" onclick="checkQuizAnswer(${idx})" class="bg-white border-2 border-[#e2e8e4] hover:border-[#8ba79b] hover:bg-[#fcfdfa] text-[#3e504c] rounded-2xl p-5 text-left transition flex items-center shadow-sm">
                        <div class="text-[#8ba79b] font-bold w-8 text-lg">${letters[idx]}.</div>
                        <span class="flex-grow text-xl font-bold">${opt.zh}</span>
                    </button>
                `;
            });

            html += `</div></div>`;
            app.innerHTML = html;
        }

        function checkQuizAnswer(selectedIndex) {
            const q = quizState.questions[quizState.currentIndex];
            const isCorrect = q.options[selectedIndex].word === q.target.word;

            // 鎖定所有按鈕並顯示正確答案
            q.options.forEach((opt, idx) => {
                const btn = document.getElementById(`quiz-opt-${idx}`);
                btn.disabled = true;
                btn.classList.remove('hover:border-[#8ba79b]', 'hover:bg-[#fcfdfa]'); 
                
                if (opt.word === q.target.word) {
                    btn.classList.add('bg-[#f0f4cd]', 'border-[#bfa860]', 'text-[#3e504c]');
                    btn.innerHTML += ` <i class="fas fa-check text-[#bfa860] text-2xl float-right ml-auto"></i>`;
                } else if (idx === selectedIndex && !isCorrect) {
                    btn.classList.add('bg-[#f0e8eb]', 'border-[#d4b5b0]', 'text-[#b8958f]');
                    btn.innerHTML += ` <i class="fas fa-times text-[#d4b5b0] text-2xl float-right ml-auto"></i>`;
                }
            });

            if (isCorrect) quizState.score++;

            // 延遲後進入下一題
            setTimeout(() => {
                quizState.currentIndex++;
                if (quizState.currentIndex < quizState.questions.length) {
                    renderQuizQuestion();
                } else {
                    renderQuizResult('multiple_choice');
                }
            }, 1200);
        }

        async function enterSpellingQuiz() {
            showAppLoading('Preparing Spelling Test...');
            const units = await getUnitsFromRanges(currentExam.ranges);
            let allWords = [];
            units.forEach(u => {
                if (u.vocab) allWords = allWords.concat(u.vocab);
                if (u.spelling) allWords = allWords.concat(u.spelling);
                if (u.HFW) allWords = allWords.concat(u.HFW);
            });

            const uniqueWords = [];
            const seenWords = new Set();
            allWords.forEach(v => {
                // Only include words with definitions for this quiz type
                if (v.word && v.def) {
                    const wordKey = v.word.toLowerCase().trim();
                    if (!seenWords.has(wordKey)) {
                        seenWords.add(wordKey);
                        uniqueWords.push(v);
                    }
                }
            });

            if (uniqueWords.length < 1) {
                alert("No words available for test within range.");
                renderExamDashboard(currentExam);
                return;
            }

            uniqueWords.sort(() => Math.random() - 0.5);
            const quizItems = uniqueWords.slice(0, 20);

            quizState = { questions: quizItems.map(item => ({ target: item })), currentIndex: 0, score: 0, type: 'spelling' };
            renderSpellingQuestion();
        }

        function renderSpellingQuestion() {
            currentView = 'exam_quiz';
            const app = document.getElementById('app');
            updateNav(true);

            const q = quizState.questions[quizState.currentIndex];
            const progress = `${quizState.currentIndex + 1} / ${quizState.questions.length}`;

            let html = `
                <div class="animate-fade-in max-w-xl mx-auto px-1">
                    <div class="mb-5 flex justify-between items-center border-b-2 border-[#e2e8e4] pb-3">
                        <span class="text-[#8ba79b] font-bold text-base">Question ${progress}</span>
                        <span class="text-[#bfa860] font-bold text-base">Score: ${quizState.score}</span>
                    </div>

                    <div class="bg-white rounded-3xl shadow-sm p-8 mb-8 border border-[#e2e8e4] text-center">
                        <p class="text-[#8a7f96] text-sm font-bold mb-4">Definition & Hint:</p>
                        <h2 class="text-xl font-bold text-[#3e504c] mb-6 leading-relaxed">${q.target.def}</h2>
                        <button onclick="speakDual('${escapeForHtml(q.target.word)}', '', null)" class="text-[#6c8a7c] hover:bg-[#f4f7f6] border-2 border-[#e2e8e4] text-2xl transition w-16 h-16 rounded-full flex items-center justify-center mx-auto shadow-sm">
                            <i class="fas fa-volume-up"></i>
                        </button>
                    </div>

                    <div id="spelling-input-area" class="space-y-5">
                        <input id="spelling-input" type="text" placeholder="Type word here..."
                               class="w-full text-center text-3xl font-bold p-5 rounded-2xl border-2 border-[#e2e8e4] focus:border-[#8ba79b] outline-none text-[#3e504c] bg-[#fcfdfa] shadow-inner"
                               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                        <button onclick="checkSpellingAnswer()" class="w-full bg-[#8ba79b] hover:bg-[#6c8a7c] text-white py-4 rounded-2xl text-xl font-bold transition shadow-md">
                            Submit
                        </button>
                    </div>
                </div>
            `;
            app.innerHTML = html;
            
            const inputEl = document.getElementById('spelling-input');
            inputEl.focus();
            inputEl.addEventListener('keyup', (event) => {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    checkSpellingAnswer();
                }
            });
            
            setTimeout(() => speakDual(q.target.word, '', null), 400);
        }

        function checkSpellingAnswer() {
            const inputEl = document.getElementById('spelling-input');
            const userAnswer = inputEl.value.trim().toLowerCase();
            const correctAnswer = quizState.questions[quizState.currentIndex].target.word.toLowerCase();
            const isCorrect = userAnswer === correctAnswer;

            document.getElementById('spelling-input-area').innerHTML = `
                <div class="w-full text-center text-3xl font-bold p-5 rounded-2xl border-2 ${isCorrect ? 'bg-[#f0f4cd] border-[#bfa860] text-[#3e504c]' : 'bg-[#f0e8eb] border-[#d4b5b0] text-[#b8958f]'} shadow-inner">
                    ${inputEl.value || '(Empty)'} ${isCorrect ? '<i class="fas fa-check ml-3"></i>' : '<i class="fas fa-times ml-3"></i>'}
                </div>
                ${!isCorrect ? `<div class="text-[#6c8a7c] text-center text-base font-bold mt-4">Correct Answer: <span class="font-extrabold tracking-wider text-xl text-[#3e504c] block mt-1">${quizState.questions[quizState.currentIndex].target.word}</span></div>` : ''}
            `;

            if (isCorrect) quizState.score++;

            setTimeout(() => {
                quizState.currentIndex++;
                if (quizState.currentIndex < quizState.questions.length) {
                    renderSpellingQuestion();
                } else {
                    renderQuizResult('spelling');
                }
            }, isCorrect ? 1000 : 2500);
        }

        function renderQuizResult(quizType) {
            currentView = 'quiz_result';
            const app = document.getElementById('app');
            const score = quizState.score;
            const total = quizState.questions.length;
            const percentage = Math.round((score / total) * 100);
            
            let message = '';
            let colorClass = '';

            if (percentage === 100) {
                message = 'Perfect Score! Amazing! 🎉';
                
            } else if (percentage >= 80) {
                message = 'Great job! Keep it up! 👍';
                colorClass = 'text-[#bfa860]';
            } else if (percentage >= 60) {
                message = 'Not bad! A little more practice! 💪';
                colorClass = 'text-[#7d9e8d]';
            } else {
                message = 'You can do it! Review and try again! 📚';
                colorClass = 'text-[#b8958f]';
            }
            const retryFunction = quizType === 'spelling' ? 'enterSpellingQuiz()' : 'enterExamQuiz()';

            app.innerHTML = `
                <div class="animate-fade-in text-center py-12 px-4">
                    <i class="fas fa-seedling text-6xl ${colorClass} mb-6 animate-bounce"></i>
                    <h2 class="text-5xl font-extrabold text-[#3e504c] mb-3">${score} <span class="text-2xl text-[#8a7f96]">/ ${total}</span></h2>
                    <p class="text-[#8ba79b] text-lg font-bold mb-8">Accuracy ${percentage}%</p>
                    
                    <p class="text-2xl font-bold ${colorClass} mb-12 bg-white p-4 rounded-2xl shadow-sm border border-[#e2e8e4] inline-block">${message}</p>

                    <div class="space-y-5 max-w-sm mx-auto">
                        <button onclick="${retryFunction}" class="w-full bg-[#8ba79b] hover:bg-[#6c8a7c] text-white py-4 rounded-2xl text-xl font-bold shadow-md transition">
                            Retry
                        </button>
                        <button onclick="renderExamDashboard(currentExam)" class="w-full bg-white text-[#6c8a7c] border-2 border-[#e2e8e4] py-4 rounded-2xl text-xl font-bold hover:bg-[#f4f7f6] transition">
                            Back to Menu
                        </button>
                    </div>
                </div>
            `;
        }

        // Utils 字串跳脫與色彩映射
        function escapeForHtml(str) {
            if (!str) return '';
            return str.replace(/`/g, '\\`').replace(/"/g, '&quot;');
        }

        // 小工具：協助在 JS 中生成 Tailwind 的 border-color 樣式 (解決 JIT 問題的折衷方案)
        // 因為我們用的是 CDN JIT，直接寫 class="border-blue-500" 只要 CDN 掃得到就可以。
        // 但為了保險，這裡做一個簡單的 map 應付 renderGradeMenu 的 style 屬性
        function tailwindColorMap(colorName) {
            // 對應至 Sage 柔和色系
            const colors = {
                'sage-green': '#8ba79b', 
                'sage-clay': '#d4b5b0', 
                'sage-blue': '#8fa8c8', 
                'sage-straw': '#d9cd90',
                'sage-purple': '#a8a0b1',
                'amber-500': '#d9cd90', 
                'pink-400': '#d4b5b0', 
                'sky-400': '#8fa8c8', 
                'blue-400': '#8fa8c8', 
                'emerald-400': '#8ba79b'
            };
            return colors[colorName] || '#8ba79b';
        }
    </script>
</body>
</html>
